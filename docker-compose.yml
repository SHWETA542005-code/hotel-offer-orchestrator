services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "7233:7233"   # gRPC
      - "8233:8233"   # Temporal Web UI

  app:
    build: .
    command: ["node", "dist/server.js"]
    environment:
      PORT: 3000
      TEMPORAL_ADDRESS: temporal:7233
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      - redis
      - temporal
    restart: on-failure

  worker:
    build: .
    command: ["node", "dist/worker.js"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      REDIS_URL: redis://redis:6379
      SUPPLIER_BASE_URL: http://app:3000
    depends_on:
      - redis
      - temporal
      - app
    restart: on-failure